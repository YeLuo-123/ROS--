turtle_painter_server:
  ros__parameters:
    linear_gain: 1.5
    angular_gain: 5.0
    max_angular_speed: 3.0
    distance_tolerance: 0.06
    heading_tolerance: 0.18
    pose_timeout: 1.0
    segment_timeout: 20.0
    control_period: 0.05

turtle_painter_client:
  ros__parameters:
    shape_name: square
    size: 2.0
    start_x: 4.5
    start_y: 4.5
    speed: 1.0
    cancel_after: 0.0

safety_guard:
  ros__parameters:
    enabled: true
    world_min: 0.0
    world_max: 11.0
    safe_margin: 1.0
    warning_margin: 2.0
    max_linear_speed: 2.0
    max_angular_speed: 2.5
    recovery_speed: 0.5
    recovery_angular_gain: 3.0
    recovery_heading_tolerance: 0.20
    command_timeout: 0.5
    control_rate: 20.0
